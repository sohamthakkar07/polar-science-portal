services:
  - type: web
    name: polarverse-api
    env: python
    region: ohio
    buildCommand: "cd polar-ai && pip install -r requirements.txt"
    startCommand: "cd polar-ai && python ingest.py && uvicorn server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: LLM_PROVIDER
        value: openrouter
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini
      - key: OPENROUTER_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
